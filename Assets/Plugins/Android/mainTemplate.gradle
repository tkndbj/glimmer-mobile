// Android Resolver Exclusions Start
android {
  packaging {
      exclude ('/lib/armeabi/*' + '*')
      exclude ('/lib/mips/*' + '*')
      exclude ('/lib/mips64/*' + '*')
      exclude ('/lib/x86/*' + '*')
      exclude ('/lib/x86_64/*' + '*')
  }
}
// Android Resolver Exclusions End

// AppsFlyer's Unity package declares its SDK and its purchase connector together, and both
// Android libraries declare the namespace `com.appsflyer`. Unity 6000.5 builds with AGP 9,
// which made a namespace shared by two modules a hard error where AGP 8 only warned - so the
// build dies at `:launcher:processDebugMainManifest` with "Manifest merger failed", which
// reads as a manifest problem and is really a dependency one. Every published version of both
// libraries declares the same namespace, so there is nothing to upgrade to.
//
// <b>The connector cannot simply be dropped, though nothing here uses it.</b> That was tried:
// `AppsFlyerAndroidWrapper` declares `private static Store mappingEnum(int)`, and Unity's
// reflection helper calls getDeclaredMethods() on that class to find any method by name -
// which resolves every signature on it. So the first call into AppsFlyer throws
// NoClassDefFoundError for `com.appsflyer.api.Store`, attribution never starts, and Gradle is
// perfectly happy about it.
//
// So the Maven coordinate is excluded and a re-namespaced copy of the same AAR is vendored
// into this folder instead - see Tools/make_appsflyer_connector.py, which explains why that
// is safe (the library ships no resources, so its namespace is nominal) and proves the
// vendored file is what it produces. Exactly one copy reaches the build either way.
//
// This lives outside the resolver's own markers on purpose: the Android Resolver rewrites
// everything between `Dependencies Start`/`End` and `Exclusions Start`/`End` on every
// resolve, so an edit made in there is gone the next time anybody opens the project.
configurations.all {
    exclude group: 'com.appsflyer', module: 'purchase-connector'
}

android {
    namespace "com.unity3d.player"
    ndkPath "**NDKPATH**"
    ndkVersion "**NDKVERSION**"
    compileSdk **APIVERSION**
    buildToolsVersion "**BUILDTOOLS**"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk **MINSDK**
        targetSdk **TARGETSDK**
        ndk {
            abiFilters **ABIFILTERS**
            debugSymbolLevel **DEBUGSYMBOLLEVEL**
        }
        consumerProguardFiles 'proguard-unity.txt'**USER_PROGUARD**
**DEFAULT_CONFIG_SETUP**
    }

    lint {
        abortOnError false
    }

    androidResources {
        noCompress = **BUILTIN_NOCOMPRESS** + unityStreamingAssets.tokenize(', ')
        ignoreAssetsPattern = "!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~"
    }**PACKAGING**
}
**IL_CPP_BUILD_SETUP**
**SOURCE_BUILD_SETUP**
**EXTERNAL_SOURCES**
